# Builds the CMU Database Android app on every push to main (or on demand).
# Download the APK from: Actions tab → latest run → Artifacts → "CMU-Database-APK".
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu machines already include the Android SDK; just add what this app needs.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "Using $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Works whether the files are at the top of the repository or inside a sub-folder
      - name: Find the project folder
        run: |
          PKG=$(find . -name package.json -not -path "*/node_modules/*" | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$PKG" ]; then
            echo "::error::package.json not found. Upload all files from the unzipped cmu-mobile folder."
            echo "Files in the repository:"; find . -maxdepth 3 -not -path "./.git*" | head -50
            exit 1
          fi
          PROJ=$(dirname "$PKG")
          echo "Project folder: $PROJ"; ls -la "$PROJ"
          for f in src/App.jsx android/gradlew android/app/build.gradle capacitor.config.json vite.config.js index.html; do
            [ -e "$PROJ/$f" ] || { echo "::error::Missing file: $f — upload it to the same place as package.json"; exit 1; }
          done
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Install and build web app
        run: |
          cd "$PROJ"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          npx cap sync android

      # Optional: a permanent release key from repository secrets (see README).
      - name: Restore release keystore (if configured)
        env:
          KS_B64: ${{ secrets.CMU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cmu-release.jks"
            echo "CMU_KEYSTORE_PATH=$RUNNER_TEMP/cmu-release.jks" >> "$GITHUB_ENV"
          else
            echo "No release key configured - building a test APK."
          fi

      - name: Build APK
        env:
          CMU_KEYSTORE_PASSWORD: ${{ secrets.CMU_KEYSTORE_PASSWORD }}
          CMU_KEY_ALIAS: ${{ secrets.CMU_KEY_ALIAS }}
          CMU_KEY_PASSWORD: ${{ secrets.CMU_KEY_PASSWORD }}
        run: |
          cd "$PROJ/android"
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -n "$CMU_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/CMU-Database-$VERSION_NAME.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/CMU-Database-$VERSION_NAME.aab"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/CMU-Database-$VERSION_NAME-test.apk"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: CMU-Database-APK
          path: out/
          retention-days: 30
